name: Build signed release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build phone transfer screen
        run: |
          cd remote/phone
          npm ci
          npm run build
          npm test
      - name: Prepare upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$UPLOAD_KEYSTORE_BASE64"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/actionbridge-upload.jks"
      - name: Verify and build
        env:
          UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/actionbridge-upload.jks
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/actionbridge-upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: ActionBridge-signed-Android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Verify and build remote receiver
        shell: pwsh
        run: |
          cd remote/receiver
          go test ./...
          go build -buildvcs=false -trimpath -ldflags="-s -w" -o ../../ActionBridge.Remote.exe .
      - run: dotnet run --project tests/ActionBridge.Tests -c Release
      - run: dotnet publish windows/ActionBridge.Windows -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o output/windows
      - shell: pwsh
        run: |
          Copy-Item ActionBridge.Remote.exe output/windows
          Copy-Item scripts/Install* output/windows
          Copy-Item scripts/Uninstall-Windows.ps1 output/windows
          Copy-Item README.md, LICENSE output/windows
      - uses: actions/upload-artifact@v4
        with:
          name: ActionBridge-Windows-x64
          path: output/windows
  connection-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm test && npm run check
        working-directory: remote/service
